services:
  openknowledge:
    image: ${OK_IMAGE:-open-knowledge:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      OK_BIND: 0.0.0.0
      OK_ALLOW_EXTERNAL: "1"
      OK_EXTERNAL_URL: ${OK_EXTERNAL_URL:?set OK_EXTERNAL_URL to the public URL of the service}
      OK_IDLE_SHUTDOWN: "off"
      DO_NOT_TRACK: "1"
      OK_LOG_LEVEL: warn
      OK_MCP_AUTOSTART: "0"
    ports:
      - "${OK_PUBLISH_ADDRESS:-127.0.0.1}:${OK_PUBLISH_PORT:-8080}:8080"
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  data:
